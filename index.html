 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 html{overflow-x:hidden}
 body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow-x:hidden}
 a{color:inherit;text-decoration:none}
 .app{display:flex;flex-direction:column;min-height:100%;padding-top:env(safe-area-inset-top);max-width:720px;margin:0 auto}
 .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:hsl(250 20% 6% / .92);backdrop-filter:blur(10px)}
 .brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:15px}
 .logo{width:28px;height:28px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:15px}
 .brand em{font-style:normal;font-size:9px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 7px}
 .who{font-size:11px;color:var(--muted);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .view{flex:1 1 auto;min-width:0;padding:12px 12px calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
 h1{font-size:19px;margin:0;letter-spacing:-.02em}
 h2{font-size:14px;margin:0}
 .sub{font-size:11px;color:var(--muted);line-height:1.5}
 .label{font-size:11px;color:var(--muted);margin:10px 0 6px;display:block}
 .hint{font-size:10px;color:var(--muted);line-height:1.6}
 button,.btn{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;min-height:38px;border-radius:12px;font-size:12px;font-weight:600;transition:background .15s,border-color .15s,color .15s,transform .06s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
 button:active{transform:scale(.975)}
 button:disabled{opacity:.45;cursor:default}
 .pill{padding:0 14px;border:1px solid var(--border);color:var(--muted)}
 .pill:hover{border-color:hsl(255 72% 64% / .5);color:var(--fg)}
 .pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
 .primary{padding:0 16px;background:var(--primary);color:#fff}
 .secondary{padding:0 16px;background:var(--secondary);color:var(--fg)}
 .danger{padding:0 14px;border:1px solid hsl(0 72% 55% / .5);color:var(--destructive)}
 .ghost{padding:0 12px;border:1px solid var(--border);color:var(--muted);font-size:11px}
 .ghost.on{border-color:var(--accent);color:var(--accent);background:hsl(175 70% 50% / .12)}
 .iconBtn{width:40px;min-width:40px;border:1px solid var(--border);font-size:18px;font-weight:700;color:var(--muted)}
 .iconBtn:hover{color:var(--fg);border-color:hsl(255 72% 64% / .5)}
 .big{min-height:44px}
 .right{margin-left:auto}
 .wide{width:100%}
 .row{display:flex;align-items:center;gap:8px}
 .row.wrap{flex-wrap:wrap}
 .grow{flex:1 1 auto;min-width:0}
 .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-width:0}
 .cardHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 @media(min-width:600px){.grid2{grid-template-columns:1fr 1fr 1fr}}
 .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .grid4 .stat{padding:8px 2px}
 .grid4 .stat b{font-size:17px}
 .field{display:flex;flex-direction:column;gap:5px;min-width:0}
 .field>span{font-size:10px;color:var(--muted);font-weight:600}
 input,select,textarea{width:100%;font-family:inherit;font-size:13px;color:var(--fg);background:var(--secondary);border:1px solid var(--border);border-radius:11px;padding:9px 11px;min-height:40px;outline:none}
 @media(pointer:coarse){input,select,textarea{font-size:16px}}
 input:focus,select:focus,textarea:focus{border-color:var(--primary)}
 select{appearance:none;-webkit-appearance:none}
 textarea{resize:vertical;min-height:64px;line-height:1.5}
 input[type=range]{padding:0;min-height:28px;background:none;border:none;accent-color:var(--primary)}
 input[type=checkbox]{width:20px;min-height:20px;height:20px;padding:0;accent-color:var(--primary);flex:0 0 auto}
 .list{display:flex;flex-direction:column;gap:8px}
 .item{display:flex;align-items:center;gap:10px;padding:11px;background:var(--card);border:1px solid var(--border);border-radius:14px;min-width:0}
 .item .title{font-size:13px;font-weight:700}
 .badge{font-size:9px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:2px 7px;color:var(--muted);white-space:nowrap}
 .badge.live{color:var(--accent);border-color:hsl(175 70% 50% / .5);background:hsl(175 70% 50% / .1)}
 .badge.host{color:var(--primary);border-color:hsl(255 72% 64% / .5);background:hsl(255 72% 64% / .1)}
 .badge.warn{color:hsl(40 90% 62%);border-color:hsl(40 90% 62% / .5);background:hsl(40 90% 62% / .1)}
 .empty{text-align:center;color:var(--muted);font-size:12px;padding:26px 12px;line-height:1.7}
 .seg{display:flex;gap:6px;flex-wrap:wrap}
 .seg button{padding:0 13px;border:1px solid var(--border);color:var(--muted)}
 .seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
 .chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
 .chip{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:1px solid var(--border);border-radius:999px;font-size:10px;font-weight:600;color:var(--muted);background:none;white-space:nowrap}
 button.chip{min-height:38px;padding:0 14px;font-size:12px}
 .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
 .chip.inst{color:var(--accent);border-color:hsl(175 70% 50% / .4);background:hsl(175 70% 50% / .08)}
 .avatar{width:30px;height:30px;border-radius:50%;background:hsl(255 72% 64% / .22);border:1px solid hsl(255 72% 64% / .5);display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
 .pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 3px;border:1px solid var(--border);border-radius:999px;background:var(--card2);font-size:11px;max-width:100%;min-width:0}
 .pchip .avatar{width:24px;height:24px;font-size:11px}
 .pchip small{color:var(--muted);font-size:9px}
 .pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:11px}
 .kv div{min-width:0}
 .kv span{display:block;color:var(--muted);font-size:9.5px;margin-bottom:1px}
 .kv b{font-weight:700;font-size:12px;overflow-wrap:anywhere}
 .vizWrap{position:relative;height:240px;flex:0 0 auto;background:radial-gradient(circle at 50% 45%,hsl(255 72% 64% / .10),transparent 70%),var(--card);border:1px solid var(--border);border-radius:22px;overflow:hidden}
 #viz{width:100%;height:100%;display:block}
 .vizHint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:10px;color:var(--muted);pointer-events:none}
 .beatDots{position:absolute;top:10px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
 .beatRow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:9px}
 .dot{width:7px;height:7px;border-radius:50%;background:hsl(250 12% 26%);transition:background .08s,transform .08s}
 .dot.on{background:var(--accent);transform:scale(1.45)}
 .dot.accent{background:var(--primary)}
 .bpm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted);min-width:74px;text-align:center}
 .tsRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
 .tsRow button{padding:0 12px;border:1px solid var(--border);color:var(--muted)}
 .tsRow button.on{background:var(--primary);border-color:var(--primary);color:#fff}
 .rhythmNow{margin-top:8px;font-size:10px;color:var(--muted)}
 .rhythmNow b{color:var(--accent);font-weight:700}
 .railHead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
 .timbres{display:flex;gap:4px;margin-left:auto}
 .timbres button{padding:0 10px;border:1px solid var(--border);color:var(--muted);font-size:11px}
 .timbres button.on{border-color:var(--primary);background:hsl(255 72% 64% / .15);color:var(--fg)}
 .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
 @media(min-width:420px){.slots{grid-template-columns:repeat(8,1fr)}}
 .slot{border:1px solid hsl(250 12% 22%);border-radius:12px;min-height:44px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg)}
 .slot.active{border-color:var(--primary);background:hsl(255 72% 64% / .16)}
 .railRow2{display:flex;align-items:center;gap:8px;margin-top:8px}
 .transpose{display:flex;align-items:center;gap:4px;margin-left:auto}
 .transpose span{font-size:9px;color:var(--muted);margin-right:2px}
 .transpose button{width:40px;border:1px solid var(--border);color:var(--muted);font-size:16px}
 .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
 .presets button{padding:0 12px;border:1px solid var(--border);color:var(--muted)}
 .chatBox{display:flex;flex-direction:column;gap:7px;max-height:210px;overflow-y:auto;padding-right:2px}
 .msg{font-size:12px;line-height:1.55;word-break:break-word}
 .msg .who2{color:var(--accent);font-weight:700;font-size:11px;margin-right:5px}
 .msg .t{color:var(--muted);font-size:9px;margin-left:6px}
 .track{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--card2);flex-wrap:wrap}
 .track .name{font-size:12px;font-weight:600}
 .track .meta{font-size:10px;color:var(--muted)}
 .lyr{padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--card2);display:flex;flex-direction:column;gap:8px;min-width:0}
 .lyr.muted{opacity:.6}
 .lyr .name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .lyr .meta{font-size:10px;color:var(--muted)}
 .seek{display:flex;align-items:center;gap:8px}
 .seek input{flex:1 1 auto}
 .seek .tm{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--muted);min-width:34px;text-align:center}
 .chordNow{text-align:center;font-size:22px;font-weight:800;min-height:30px;letter-spacing:-.01em}
 .recDot{width:9px;height:9px;border-radius:50%;background:var(--destructive);animation:blink 1s infinite}
 @keyframes blink{50%{opacity:.25}}
 .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;border-top:1px solid var(--border);background:hsl(250 20% 6% / .96);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);max-width:720px;margin:0 auto}
 .nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:9.5px;font-weight:600;color:var(--muted)}
 .nav a .ico{font-size:15px;line-height:1}
 .nav a.on{color:var(--primary)}
 .layer{position:fixed;inset:0;z-index:60;background:hsl(250 20% 4% / .78);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
 @media(min-width:640px){.layer{align-items:center}}
 .sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;overflow-x:hidden;background:var(--card);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
 @media(min-width:640px){.sheet{border-radius:22px}}
 .sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
 .sheetHead h2{font-size:14px;margin:0;font-weight:800}
 .catTitle{font-size:11px;font-weight:700;margin:14px 0 8px}
 .gridBtns{display:flex;flex-wrap:wrap;gap:6px}
 .gridBtns button{padding:0 14px;border:1px solid var(--border);color:var(--fg)}
 .gridBtns button.on{background:var(--primary);border-color:var(--primary);color:#fff}
 .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));background:hsl(250 15% 20%);border:1px solid var(--border);padding:9px 15px;border-radius:999px;font-size:12px;z-index:80;box-shadow:0 8px 24px hsl(0 0% 0% / .45);max-width:86vw;text-align:center}
 audio{width:100%;height:34px}
 .stat{text-align:center;padding:10px 4px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
 .stat b{display:block;font-size:19px;font-family:ui-monospace,Menlo,monospace}
 .stat span{font-size:10px;color:var(--muted)}
 .checkRow{display:flex;align-items:center;gap:10px;min-height:40px;font-size:12px}
 .view.jamView{padding:8px 10px calc(60px + env(safe-area-inset-bottom));gap:8px;height:calc(100vh - 50px - env(safe-area-inset-top));height:calc(100dvh - 50px - env(safe-area-inset-top));overflow:hidden;touch-action:pan-y}
 .jamView .vizWrap{height:auto;flex:1 1 0;min-height:80px;border-radius:20px}
 .jamView .card{padding:8px;flex:0 0 auto}
 .jamView .railHead{gap:6px}
 .jamView .railHead button,.jamView .timbres button{min-height:34px}
 .jamView .slots{grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
 .jamView .slot{min-height:38px;font-size:11px;border-radius:10px;padding:0}
 .jamView .tsRow{gap:4px;margin-top:6px;flex-wrap:nowrap}
 .jamView .tsRow button{flex:1 1 0;min-width:0;padding:0;min-height:32px;font-size:11px;border-radius:10px}
 .jamView .bpm{min-width:64px}
 .iconTop{position:relative;width:40px;min-width:40px;padding:0;border:1px solid var(--border);font-size:16px;color:var(--muted)}
 .iconTop i{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--primary);color:#fff;font-size:9px;font-style:normal;display:grid;place-items:center;padding:0 3px}
 .drawerBack{position:fixed;inset:0;z-index:48;background:hsl(250 20% 4% / .6);backdrop-filter:blur(3px)}
 .drawer{position:fixed;top:0;bottom:0;width:min(86vw,340px);z-index:49;background:var(--card);border:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transition:transform .22s ease;touch-action:pan-y}
 .drawer.left{left:0;transform:translateX(-105%);border-radius:0 22px 22px 0}
 .drawer.right{right:0;transform:translateX(105%);border-radius:22px 0 0 22px}
 .drawer.open{transform:none}
 .drawer .chatBox{flex:1 1 auto;max-height:none;min-height:0}
 .drawer .list{overflow-y:auto;min-height:0}
 .profCard{display:flex;flex-direction:column;gap:10px}
 .profTop{display:flex;align-items:center;gap:12px}
 .profTop .avatar{width:48px;height:48px;font-size:20px}
 .profTop input{font-weight:700;font-size:15px}
 [hidden]{display:none !important}
.tog{width:46px;min-width:46px;height:28px;border-radius:14px;border:1px solid var(--border);background:var(--secondary);position:relative;padding:0}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.15s}
.tog.on{background:hsl(175 70% 50%/.25);border-color:var(--accent)}
.tog.on::after{left:21px;background:var(--accent)}
.lyr.muted .name,.lyr.muted .meta{opacity:.45}
.profRow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer}
</style>
</head>
<body>
<div class="app">
 <header class="topbar">
  <div class="brand"><span class="logo">♪</span>Stackjam</div>
  <div class="who" id="who"></div>
 </header>
 <main id="view" class="view"></main>
</div>
<nav class="nav" id="nav">
 <a href="#/" data-tab="/"><span class="ico">◎</span>Home</a>
 <a href="#/rooms" data-tab="/rooms"><span class="ico">◍</span>Rooms</a>
 <a href="#/threads" data-tab="/threads"><span class="ico">≣</span>Threads</a>
 <a href="#/library" data-tab="/library"><span class="ico">▤</span>Library</a>
 <a href="#/profile" data-tab="/profile"><span class="ico" style="font-size:17px">⚙</span>Setting</a>
</nav>
<div id="layer"></div>
<script>
(function () {
 'use strict';
 /* ══════════════ 基本ユーティリティ ══════════════ */
 var $ = function (s, r) { return (r || document).querySelector(s); };
 function uid(p) { return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
 function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
 function fmtTime(sec) { sec = Math.max(0, Math.round(sec || 0)); var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
 function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
 function hhmm(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
 function sessionDate(ts) { var d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hhmm(ts); }
 function lsGet(key, fallback) { try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
 function lsSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
 function lsDel(key) { try { localStorage.removeItem(key); } catch (e) {} }
 var toastTimer = null;
 function toast(msg) {
  var old = document.querySelectorAll('.toast');
  for (var i = 0; i < old.length; i++) old[i].remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 2800);
 }
 function openSheet(title, build, onClose) {
  var layer = $('#layer');
  var wrap = document.createElement('div');
  wrap.className = 'layer';
  wrap._onClose = onClose || null;
  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  var head = document.createElement('div');
  head.className = 'sheetHead';
  var h = document.createElement('h2');
  h.textContent = title;
  var close = document.createElement('button');
  close.className = 'pill';
  close.textContent = '✕';
  head.appendChild(h); head.appendChild(close);
  var body = document.createElement('div');
  sheet.appendChild(head); sheet.appendChild(body);
  wrap.appendChild(sheet);
  wrap.addEventListener('click', function (e) { if (e.target === wrap) closeLayer(wrap); });
  close.addEventListener('click', function () { closeLayer(wrap); });
  layer.appendChild(wrap);
  build(body, function () { closeLayer(wrap); });
  return { close: function () { closeLayer(wrap); }, body: body };
 }
 function closeLayer(wrap) {
  if (!wrap) return;
  var cb = wrap._onClose; wrap._onClose = null;
  if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
  if (cb) { try { cb(); } catch (e) {} }
 }
 function closeAllSheets() {
  var all = document.querySelectorAll('#layer .layer');
  for (var i = 0; i < all.length; i++) closeLayer(all[i]);
  $('#layer').innerHTML = '';
 }
 function confirmSheet(title, message, okLabel, onOk) {
  openSheet(title, function (body, close) {
   body.innerHTML = '<div class="sub">' + esc(message) + '</div>' +
    '<div class="row" style="margin-top:14px"><button class="danger grow big" id="cfYes">' + esc(okLabel) + '</button><button class="ghost big" id="cfNo">✕</button></div>';
   $('#cfNo', body).addEventListener('click', close);
   $('#cfYes', body).addEventListener('click', function () { close(); onOk(); });
  });
 }
 function askTitle(heading, def, okLabel, onOk) {
  openSheet(heading, function (body, close) {
   body.innerHTML = '<div class="field"><span>Title</span><input id="atTitle" maxlength="60"></div>' +
    '<button class="primary wide big" id="atGo" style="margin-top:14px">' + esc(okLabel) + '</button>';
   var inp = $('#atTitle', body); inp.value = def || '';
   $('#atGo', body).addEventListener('click', function () {
    var t = (inp.value || '').trim().slice(0, 60) || 'Untitled';
    close(); onOk(t);
   });
  });
 }
 function optionList(list, sel) {
  return list.map(function (v) {
   return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');
 }
 function isUnlocked(id) { try { return JSON.parse(sessionStorage.getItem('stackjam.unlocked') || '[]').indexOf(id) >= 0; } catch (e) { return false; } }
 function unlock(id) { try { var l = JSON.parse(sessionStorage.getItem('stackjam.unlocked') || '[]'); if (l.indexOf(id) < 0) l.push(id); sessionStorage.setItem('stackjam.unlocked', JSON.stringify(l)); } catch (e) {} }

 /* ══════════════ プロフィール ══════════════ */
 var PROFILE_KEY = 'sonova.profile';
 var profile = lsGet(PROFILE_KEY, null);

 /* ══════════════ Anchor: ミックスのクレジットのハッシュを Solana devnet に Memo として記録 ══════════════ */
 var RPC_URL = 'https://api.devnet.solana.com', MEMO_PROGRAM = 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr';
 function shortvec(n) { var o = []; for (;;) { var b = n & 0x7f; n >>= 7; if (n) o.push(b | 0x80); else { o.push(b); break; } } return o; }
 function concatBytes(parts) {
  var total = 0, i; parts.forEach(function (p) { total += p.length; });
  var out = new Uint8Array(total), pos = 0;
  parts.forEach(function (p) { for (i = 0; i < p.length; i++) out[pos + i] = p[i]; pos += p.length; });
  return out;
 }
 function bytesToB64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
 function rpcCall(method, params) {
  return fetch(RPC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params }) })
   .then(function (r) { return r.json(); }).then(function (j) { if (j.error) throw new Error(j.error.message || 'rpc'); return j.result; });
 }
 function sendMemo(text) {
  var p = getProvider(), w = getWallet();
  if (!p || !w) return Promise.reject(new Error('wallet'));
  return rpcCall('getBalance', [w]).then(function (r) {
   if ((r.value || 0) < 10000) throw new Error('funds');
   return rpcCall('getLatestBlockhash', [{ commitment: 'finalized' }]);
  }).then(function (r) {
   var data = new TextEncoder().encode(text);
   var msg = concatBytes([[1, 0, 1], shortvec(2), b58dec(w), b58dec(MEMO_PROGRAM), b58dec(r.value.blockhash), shortvec(1), [1], shortvec(1), [0], shortvec(data.length), data]);
   var req = Promise.resolve(p.request({ method: 'signTransaction', params: { message: b58enc(msg) } })).then(function (res) {
    var tx = concatBytes([[1], b58dec(res.signature), msg]);
    return rpcCall('sendTransaction', [bytesToB64(tx), { encoding: 'base64', preflightCommitment: 'confirmed' }]);
   });
   return req.catch(function (e) {
    if (e && (e.message === 'funds' || /blockhash|insufficient/i.test(e.message || ''))) throw e;
    var first = 'signTransaction: ' + ((e && e.message) || String(e));
    return Promise.resolve(p.request({ method: 'signAndSendTransaction', params: { message: b58enc(msg) } })).then(function (res) { return res.signature; })
     .catch(function (e2) { throw new Error(first + ' / signAndSendTransaction: ' + ((e2 && e2.message) || String(e2))); });
   });
  });
 }
 function waitConfirm(sig, tries) {
  return rpcCall('getSignatureStatuses', [[sig]]).then(function (r) {
   var s = r.value && r.value[0];
   if (s && s.err) throw new Error('failed');
   if (s && (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized')) return true;
   if (tries <= 0) return false;
   return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return waitConfirm(sig, tries - 1); });
  });
 }
 function anchorSession(s, done) {
  if (!getWallet()) { toast('🔗 Wallet'); return; }
  var c = s.credits; if (!c) return;
  toast('⚓ …');
  sha256Hex(new Blob([JSON.stringify({ m: c.mixHash, c: c.creators.map(function (x) { return x.hash; }) })])).then(function (ch) {
   var memo = 'stackjam:v1|' + c.mixHash + '|' + ch;
   return sendMemo(memo).then(function (sig) {
    return waitConfirm(sig, 12).then(function (okc) {
     patchSession(s.id, { anchor: { sig: sig, cluster: 'devnet', at: Date.now(), memo: memo, confirmed: okc } });
     bump('anchors'); toast('⚓ ✓');
     if (done) done();
    });
   });
  }).catch(function (e) {
   var m = (e && e.message) || '';
   toast(m === 'funds' ? 'Need devnet SOL' : m === 'wallet' ? '🔗 Wallet' : 'Anchor failed');
   if (m !== 'funds' && m !== 'wallet') { try { alert('Anchor failed\n' + (m || String(e))); } catch (_) {} }
  });
 }
 function openAnchorInfo(s) {
  var a = s.anchor;
  openSheet('⚓ devnet', function (body) {
   body.innerHTML = '<div class="kv"><div><span>Tx</span><b>' + esc(a.sig.slice(0, 8) + '…' + a.sig.slice(-6)) + '</b></div><div><span>Net</span><b>devnet</b></div></div>' +
    '<a class="primary wide big" style="display:flex;align-items:center;justify-content:center;margin-top:14px" target="_blank" rel="noopener" href="https://explorer.solana.com/tx/' + encodeURIComponent(a.sig) + '?cluster=devnet">↗ Explorer</a>';
  });
 }
 /* ══════════════ クラウド（Supabase）: 音声の公開・スレッドのリンク共有 ══════════════
    秘密の値（ホスト／投稿者トークン）は端末の localStorage にだけ置き、サーバーにはハッシュだけ送る。 */
 var SB_LS = 'sonova.sb', TOK_LS = 'sonova.tokens';
 function sbCfg() { var c = lsGet(SB_LS, null); return c && c.url && c.key ? { url: String(c.url).trim().replace(/\/+$/, ''), key: String(c.key).trim() } : null; }
 function cloudOn() { return !!sbCfg(); }
 function getTok(k) { return (lsGet(TOK_LS, {}) || {})[k] || ''; }
 function setTok(k, v) { var t = lsGet(TOK_LS, {}) || {}; if (v) t[k] = v; else delete t[k]; lsSet(TOK_LS, t); }
 function randHex(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
 function sbHeaders(extra) { var c = sbCfg(); return Object.assign({ apikey: c.key, Authorization: 'Bearer ' + c.key }, extra || {}); }
 function sbRpc(name, args) {
  var c = sbCfg(); if (!c) return Promise.reject(new Error('nocloud'));
  return fetch(c.url + '/rest/v1/rpc/' + name, { method: 'POST', headers: sbHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(args) }).then(function (r) {
   return r.text().then(function (t) {
    var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
    if (!r.ok) throw new Error((j && j.message) || ('http ' + r.status));
    return j;
   });
  });
 }
 function sbSelect(table, query) {
  var c = sbCfg(); if (!c) return Promise.reject(new Error('nocloud'));
  return fetch(c.url + '/rest/v1/' + table + '?' + query, { headers: sbHeaders() }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
 }
 function sbUpload(path, blob) {
  var c = sbCfg(), type = (blob.type || 'audio/wav').split(';')[0];
  return fetch(c.url + '/storage/v1/object/audio/' + path, { method: 'POST', headers: sbHeaders({ 'Content-Type': type }), body: blob }).then(function (r) {
   if (!r.ok && r.status !== 409) throw new Error('upload ' + r.status);
   return path;
  });
 }
 function audioUrl(path) { return sbCfg().url + '/storage/v1/object/public/audio/' + path; }
 function sbDownload(path) { return fetch(audioUrl(path)).then(function (r) { if (!r.ok) throw new Error('download'); return r.blob(); }); }
 function errToast(e) {
  var m = (e && e.message) || '';
  toast(m === 'full' ? 'Full' : m === 'closed' ? 'Closed' : m === 'wallet required' ? '🔗 Wallet' : m === 'taken' ? 'ID taken' : m === 'denied' ? 'Not allowed' : m === 'nocloud' ? '☁ Setting' : '☁ ✕');
 }

 /* ---------- リンク（接続先も含めるので、受け取った側は設定なしで開ける） ---------- */
 function cfgToken() { var c = sbCfg(); return btoa(JSON.stringify([c.url, c.key])).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
 function applyCfgToken(tok) {
  try {
   var s = tok.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
   var a = JSON.parse(atob(s));
   if (/^https:\/\//.test(a[0]) && a[1]) { lsSet(SB_LS, { url: a[0], key: a[1] }); return true; }
  } catch (e) {}
  return false;
 }
 function threadLink(th) { return location.href.split('#')[0].split('?')[0] + '#/t/' + th.id + '/' + cfgToken(); }
 function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
  return Promise.resolve(false);
 }

 /* ---------- スレッド ---------- */
 var META_KEYS = ['title', 'songTitle', 'description', 'hostName', 'hostWallet', 'genre', 'instrumentsNeeded', 'bpm', 'timeSignature', 'rhythm', 'chordEnabled', 'chordSlots', 'timbre', 'maxLayers', 'needWallet', 'parent', 'lineage', 'createdAt'];
 function threadMeta(th) { var m = {}; META_KEYS.forEach(function (k) { if (th[k] !== undefined) m[k] = th[k]; }); return m; }
 function layerData(l) {
  var d = {}; ['id', 'userId', 'userName', 'instrument', 'durationSeconds', 'createdAt', 'volume', 'hash', 'wallet', 'msg', 'sig', 'from'].forEach(function (k) { if (l[k] !== undefined) d[k] = l[k]; });
  return d;
 }
 function layerPath(th, l) { return th.id + '/' + l.id + '.wav'; }
 function cloudPushLayer(th, l) {
  var ot = getTok('l:' + l.id) || randHex(16); setTok('l:' + l.id, ot);
  return getAudio('layer_' + l.id).then(function (blob) {
   if (!blob) throw new Error('noaudio');
   return sbUpload(layerPath(th, l), blob);
  }).then(function () {
   return sbRpc('add_layer', { p_thread: th.id, p_id: l.id, p_data: layerData(l), p_path: layerPath(th, l), p_owner: ot });
  });
 }
 function cloudPublishThread(th) {
  var token = randHex(16);
  return sbRpc('create_thread', { p_id: th.id, p_meta: threadMeta(th), p_public: !!th.isPublic, p_token: token }).then(function () {
   setTok('t:' + th.id, token);
   var chain = Promise.resolve();
   th.layers.forEach(function (l) {
    chain = chain.then(function () {
     return cloudPushLayer(th, l).then(function () { if (isOff(l)) return sbRpc('set_layer_off', { p_layer: l.id, p_off: true, p_token: token }); });
    });
   });
   return chain;
  }).then(function () {
   var cur = getThread(th.id); cur.cloud = true; cur.layers.forEach(function (l) { l.cloud = true; });
   if (cur.status === 'closed') sbRpc('set_status', { p_id: th.id, p_status: 'closed', p_token: token }).catch(function () {});
   saveThread(cur); return cur;
  });
 }
 /* サーバーの状態をこの端末のスレッドに取り込む（新しい演奏・ホストの ON/OFF・終了） */
 function cloudPull(id) {
  return sbRpc('get_thread_full', { p_id: id }).then(function (res) {
   if (!res) throw new Error('gone');
   var meta = res.thread.meta || {};
   var th = getThread(id);
   if (!th) {
    th = Object.assign({}, meta, { id: id, hostId: getTok('t:' + id) ? profile.id : 'cloud', isPublic: res.thread.is_public, password: '', status: 'open', layers: [], cloud: true, imported: true, createdAt: meta.createdAt || Date.now() });
   }
   var iAmHost = th.hostId === profile.id;
   var remote = {}; res.layers.forEach(function (rl) { remote[rl.id] = rl; });
   var chain = Promise.resolve(), added = 0;
   res.layers.forEach(function (rl) {
    chain = chain.then(function () {
     var have = th.layers.filter(function (l) { return l.id === rl.id; })[0];
     if (have) { have.hostOff = !!rl.host_off; have.cloud = true; return; }
     return sbDownload(rl.path).then(function (blob) { return putAudio('layer_' + rl.id, blob); }).then(function () {
      th.layers.push(Object.assign({}, rl.data, { hostOff: !!rl.host_off, fresh: iAmHost && rl.data.userId !== profile.id, cloud: true })); added++;
     });
    });
   });
   return chain.then(function () {
    th.layers = th.layers.filter(function (l) { if (l.cloud && !remote[l.id]) { delAudio('layer_' + l.id); return false; } return true; });
    th.status = res.thread.status === 'closed' ? 'closed' : 'open';
    th.status = statusOf(th); th.cloud = true;
    saveThread(th);
    return { thread: th, added: added };
   });
  });
 }
 function cloudSetOff(th, l) { var tk = getTok('t:' + th.id); if (th.cloud && tk && l.cloud) sbRpc('set_layer_off', { p_layer: l.id, p_off: isOff(l), p_token: tk }).catch(errToast); }
 function cloudSetStatus(th) { var tk = getTok('t:' + th.id); if (th.cloud && tk) sbRpc('set_status', { p_id: th.id, p_status: th.status === 'closed' ? 'closed' : 'open', p_token: tk }).catch(errToast); }
 function cloudDeleteThread(th) { var tk = getTok('t:' + th.id); if (th.cloud && tk) sbRpc('delete_thread', { p_id: th.id, p_token: tk }).catch(function () {}); setTok('t:' + th.id, ''); }
 function cloudDeleteLayer(th, l) {
  if (!th.cloud || !l.cloud) return;
  var tk = getTok('l:' + l.id) || getTok('t:' + th.id);
  if (tk) sbRpc('delete_layer', { p_layer: l.id, p_token: tk }).catch(function () {});
  setTok('l:' + l.id, '');
 }
 function cloudBrowse() { return sbSelect('threads', 'select=id,meta,status&is_public=eq.true&status=eq.open&order=created_at.desc&limit=30'); }

 /* ---------- 作品（ライブラリ） ---------- */
 function cloudPublishWork(session, shareId) {
  return getAudio(session.id).then(function (blob) {
   if (!blob) throw new Error('noaudio');
   var ext = session.audioExt || 'wav', path = 'works/' + shareId + '-' + randHex(4) + '.' + ext;
   return sbUpload(path, blob).then(function () {
    var tk = randHex(16);
    return sbRpc('publish_work', { p_share: shareId, p_title: session.title || shareId, p_credits: session.credits || null, p_anchor: session.anchor || null, p_path: path, p_dur: Math.round(session.durationSeconds || 0), p_token: tk })
     .then(function () { setTok('w:' + shareId, tk); return path; });
   });
  });
 }
 function cloudUnpublishWork(session) {
  if (!session.shareId) return;
  var tk = getTok('w:' + session.shareId);
  if (tk) sbRpc('unpublish_work', { p_share: session.shareId, p_token: tk }).catch(function () {});
  setTok('w:' + session.shareId, '');
 }
 function cloudSearchWorks(q) {
  var qq = q.replace(/[^A-Za-z0-9_\- ]/g, '');
  var filter = qq ? '&or=(share_id.eq.' + encodeURIComponent(qq) + ',title.ilike.*' + encodeURIComponent(qq) + '*)' : '';
  return sbSelect('works', 'select=*&order=created_at.desc&limit=30' + filter);
 }

 /* ══════════════ スレッド（データ） ══════════════ */
 var THREADS_KEY = 'sonova.threads';
 function getThreads() { var t = lsGet(THREADS_KEY, []); return Array.isArray(t) ? t : []; }
 function setThreads(list) { lsSet(THREADS_KEY, list); }
 function getThread(id) { var l = getThreads(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
 function saveThread(th) {
  var found = false;
  var list = getThreads().map(function (t) { if (t.id === th.id) { found = true; return th; } return t; });
  if (!found) list.push(th);
  setThreads(list);
 }
 function statusOf(th) {
  if (th.status === 'closed') return 'closed';
  return (th.layers || []).length >= th.maxLayers ? 'full' : 'open';
 }
 function statusLabel(s) { return s === 'closed' ? 'Closed' : s === 'full' ? 'Full' : 'Open'; }
 function removeThreadData(th) {
  cloudDeleteThread(th);
  (th.layers || []).forEach(function (l) { delAudio('layer_' + l.id); });
  setThreads(getThreads().filter(function (t) { return t.id !== th.id; }));
 }
 function threadCfg(th) {
  return { bpm: th.bpm, ts: th.timeSignature, rhythm: th.rhythm, chordEnabled: !!th.chordEnabled, slots: th.chordSlots || [], timbre: th.timbre || 'piano' };
 }
 function isOff(l) { return !!(l.hostOff || l.muted); }
 function activeLayers(t) { return (t.layers || []).filter(function (l) { return !isOff(l); }); }
 function freshCount(t) { return (t.layers || []).filter(function (l) { return l.fresh; }).length; }
 function normName(s) { return String(s || '').trim().toLowerCase(); }
 function initial(s) { return esc((String(s || '?').trim().slice(0, 1) || '?').toUpperCase()); }

 /* ══════════════ スレッドの共有（.json）／読込・合流 ══════════════
    端末をまたいで「誰でも重ねられる」ようにするための受け渡し。
    同じスレッド ID を読み込むと、新しい演奏だけが既存スレッドに合流する。 */
 function buildExport(th) {
  var host = th.hostId === profile.id;
  var out = { format: 'stackjam-thread', version: 2, exportedAt: Date.now(), exportedBy: profile.id, thread: Object.assign({}, th, { layers: undefined, password: host ? th.password : '' }), layers: [] };
  var chain = Promise.resolve();
  (th.layers || []).filter(function (l) { return host || l.userId === profile.id; }).forEach(function (l) {
   chain = chain.then(function () {
    return getAudio('layer_' + l.id).then(function (blob) {
     if (!blob) return;
     return blobToDataUrl(blob).then(function (url) { out.layers.push({ layer: Object.assign({}, l, { fresh: false }), audio: url }); });
    });
   });
  });
  return chain.then(function () {
   var name = 'stackjam-' + (th.title || 'thread').replace(/[\\/:*?"<>|\s]+/g, '_') + '.json';
   return { blob: new Blob([JSON.stringify(out)], { type: 'application/json' }), name: name };
  });
 }
 function exportThread(th) {
  toast('…');
  buildExport(th).then(function (r) {
   var file = null;
   try { file = new File([r.blob], r.name, { type: 'application/json' }); } catch (e) {}
   if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    return navigator.share({ files: [file], title: th.title }).catch(function (err) {
     if (!err || err.name !== 'AbortError') { downloadBlob(r.blob, r.name); toast('✓'); }
    });

 }
 function importThreadFile(file, done) {
  var fr = new FileReader();
  fr.onerror = function () { toast('Import failed'); };
  fr.onload = function () {
   var data;
   try { data = JSON.parse(fr.result); } catch (e) { toast('Not a Stackjam file'); return; }
   if (data && data.format === 'stackjam-credits') { importCredits(data); done(null); return; }
   if (!data || data.format !== 'stackjam-thread' || !data.thread) { toast('Not a Stackjam file'); return; }
   var src = data.thread, items = (data.layers || []).filter(function (it) { return it && it.layer && it.audio; });
   var existing = src.id ? getThread(src.id) : null;
   var th, added = 0, chain = Promise.resolve();
   if (existing) {
    th = existing;
    var iAmHost = th.hostId === profile.id;
    items.forEach(function (it) {
     chain = chain.then(function () {
      var have = th.layers.filter(function (l) { return l.id === it.layer.id; })[0];
      if (have) { if (!iAmHost && it.layer.hostOff !== undefined) have.hostOff = !!it.layer.hostOff; return; }
      if (th.needWallet && !it.layer.wallet) return;
      var same = th.layers.filter(function (l) { return slotMatch(l, it.layer); })[0];
      if (same && same.createdAt >= it.layer.createdAt) return;
      if (!same && th.layers.length >= th.maxLayers) return;
      var bl = dataUrlToBlob(it.audio);
      return sha256Hex(bl).then(function (h) { if (it.layer.hash && it.layer.hash !== h) it.layer.hashBad = true; return putAudio('layer_' + it.layer.id, bl); }).then(function () {
       if (same) { th.layers = th.layers.filter(function (l) { return l.id !== same.id; }); delAudio('layer_' + same.id); }
       var nl = Object.assign({}, it.layer, { fresh: iAmHost });
       if (iAmHost) nl.hostOff = !!nl.hashBad;
       th.layers.push(nl); added++;
      });
     });
    });
   } else {
    th = Object.assign({}, src, {
     id: src.id || uid('th'), createdAt: src.createdAt || Date.now(), layers: [], imported: true, password: src.password || '',
     maxLayers: clamp(parseInt(src.maxLayers, 10) || 4, 2, 10), bpm: clamp(parseInt(src.bpm, 10) || 120, 40, 300),
     instrumentsNeeded: Array.isArray(src.instrumentsNeeded) ? src.instrumentsNeeded : [],
     chordSlots: Array.isArray(src.chordSlots) && src.chordSlots.length ? src.chordSlots.slice(0, 8) : ['C', 'G', 'Am', 'F', 'C', 'G', 'Am', 'F'],
     rhythm: RHYTHMS[src.rhythm] ? src.rhythm : 'mute'
    });
    items.slice(0, th.maxLayers).forEach(function (it) {
     chain = chain.then(function () {
      var bl2 = dataUrlToBlob(it.audio);
      return sha256Hex(bl2).then(function (h) { if (it.layer.hash && it.layer.hash !== h) it.layer.hashBad = true; return putAudio('layer_' + it.layer.id, bl2); }).then(function () { th.layers.push(Object.assign({}, it.layer, { fresh: false })); added++; });
     });
    });
   }
   chain.then(function () {
    th.status = statusOf(Object.assign({}, th, { status: th.status === 'closed' ? 'closed' : 'open' }));
    saveThread(th);
    toast(existing ? '+' + added : '✓');
    done(th);
   }).catch(function () { toast('Import failed'); });
  };
  fr.readAsText(file);
 }

    results.forEach(function (s) { list.appendChild(sessionCard(s, { public: true })); });
   }
   $('#libGo', body).addEventListener('click', run);
   query.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
   run();
  }
  function drawTab() {
   Array.prototype.slice.call(tabs.children).forEach(function (b) { b.className = b.getAttribute('data-tab') === tab ? 'on' : ''; });
   if (tab === 'mine') drawMine(); else drawSearch();
  }
  tabs.addEventListener('click', function (e) {
   var t = e.target.getAttribute && e.target.getAttribute('data-tab');
   if (!t) return;
   tab = t; drawTab();
  });
  drawTab();
 }

 /* ══════════════ 履歴（1 件ずつ・まとめて削除できる） ══════════════ */
 function renderHistory(view) {
  var list = getSessions().filter(function (s) { return !s.hasAudio; });
  view.innerHTML = '<div class="row"><a class="ghost big" href="#/profile" aria-label="Back">←</a><div class="grow"><h1>History</h1></div>' +
   (list.length ? '<button class="danger big" id="histClear" aria-label="Clear all">🗑</button>' : '') + '</div>' +
   '<div class="list" id="histList"></div>';
  var el = $('#histList', view);
  if (!list.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
  list.forEach(function (s) {
   var item = document.createElement('div');
   item.className = 'item';
   item.innerHTML = '<div class="grow"><div class="title">' + esc(s.title) + '</div>' +
    '<div class="sub">' + sessionDate(s.createdAt) + ' · ' + esc(s.roomName || '') + '</div></div>';
   var del = document.createElement('button');
   del.className = 'ghost'; del.textContent = '🗑'; del.setAttribute('aria-label', 'Delete');
   del.addEventListener('click', function () { removeSession(s.id); renderHistory(view); });
   item.appendChild(del);
   el.appendChild(item);
  });
  var clr = $('#histClear', view);
  if (clr) clr.addEventListener('click', function () {
   confirmSheet('Clear history?', String(list.length), 'Clear', function () { list.forEach(function (s) { removeSession(s.id); }); renderHistory(view); });
  });
 }

 /* ══════════════ Setting ══════════════ */
 function fmtBytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
 function renderProfile(view) {
  var st = getSettings();
  view.innerHTML = '<h1>Setting</h1>' +
   '<div class="card">' +
   '<div class="row"><span class="grow">☁ Cloud</span><button class="pill big" id="stCloud"></button></div>' +
   '<div class="row" style="margin-top:12px"><span class="grow">🔗 Wallet</span><button class="pill big" id="stWallet"></button></div>' +
   '<div class="row" style="margin-top:12px"><span class="grow">🎧 Latency</span><button class="iconBtn" id="stLatDn">−</button><span class="bpm" id="stLat" style="min-width:64px;text-align:center"></span><button class="iconBtn" id="stLatUp">+</button></div>' +
   '<div class="row" style="margin-top:12px"><span class="grow">① Count-in</span><div class="seg" id="stCount" style="width:130px"><button data-v="1">1</button><button data-v="2">2</button></div></div>' +
   '<div class="row" style="margin-top:12px"><span class="grow">▤ Storage</span><span class="sub" id="stStore">…</span></div>' +
   '</div>' +
   '<a class="item" href="#/history"><div class="grow"><div class="title">↺ History</div></div><span class="badge">›</span></a>' +
   '<div class="card"><button class="danger wide big" id="pfReset">🗑 All data</button></div>';
  function drawSet() {
   var s = getSettings();
   $('#stLat', view).textContent = s.latency + ' ms';
   var cb = $('#stCloud', view); cb.textContent = cloudOn() ? '✓' : '—'; cb.className = (cloudOn() ? 'pill on' : 'pill') + ' big';
   var wb = $('#stWallet', view), wa = getWallet();
   wb.textContent = wa ? shortAddr(wa) + ' ✕' : 'Connect';
   wb.className = (wa ? 'pill on' : 'pill') + ' big';
   Array.prototype.forEach.call($('#stCount', view).children, function (b) { b.className = String(s.countBars) === b.getAttribute('data-v') ? 'on' : ''; });
  }
  $('#stCloud', view).addEventListener('click', function () { openCloudSheet(drawSet); });
  $('#stWallet', view).addEventListener('click', function () { if (getWallet()) disconnectWallet(drawSet); else connectWallet(drawSet); });
  $('#stLatDn', view).addEventListener('click', function () { saveSettings({ latency: clamp(getSettings().latency - 10, 0, 500) }); drawSet(); });
  $('#stLatUp', view).addEventListener('click', function () { saveSettings({ latency: clamp(getSettings().latency + 10, 0, 500) }); drawSet(); });
  $('#stCount', view).addEventListener('click', function (e) { var v = e.target.getAttribute && e.target.getAttribute('data-v'); if (v) { saveSettings({ countBars: parseInt(v, 10) }); drawSet(); } });
  drawSet();
  try {
   if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function (e) { var el = $('#stStore', view); if (el) el.textContent = fmtBytes(e.usage || 0); });
   else $('#stStore', view).textContent = '—';
  } catch (e) { $('#stStore', view).textContent = '—'; }
  $('#pfReset', view).addEventListener('click', function () {
   confirmSheet('Delete all data?', '🗑', 'Delete all', function () {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('sonova') === 0) keys.push(k); }
    keys.forEach(function (k) { localStorage.removeItem(k); });
    try { sessionStorage.removeItem('stackjam.unlocked'); } catch (e) {}
    db().then(function (d) {
     var tx = d.transaction(DB_STORE, 'readwrite');
     tx.objectStore(DB_STORE).clear();
     tx.oncomplete = function () { location.reload(); };
     tx.onerror = function () { location.reload(); };
    }).catch(function () { location.reload(); });
   });
  });
 }

/* ══════════════ 共有リンクから開く ══════════════ */
 function renderCloudOpen(view, id, cfgTok) {
  if (cfgTok && !cloudOn()) applyCfgToken(cfgTok);
  view.innerHTML = '<div class="empty">…</div>';
  if (!cloudOn()) { view.innerHTML = '<div class="empty">☁<br><br><a class="pill" href="#/profile" style="display:inline-flex;align-items:center;padding:0 14px">⚙</a></div>'; return; }
  cloudPull(id).then(function () { location.replace('#/thread/' + id); }, function (e) {
   view.innerHTML = '<div class="empty">' + (e && e.message === 'gone' ? '—' : '☁ ✕') + '<br><br><a class="pill" href="#/threads" style="display:inline-flex;align-items:center;padding:0 14px">←</a></div>';
  });
 }

 /* ══════════════ ルーター ══════════════ */
 function updateNav(path) {
  var tab = path;
  if (path === '/room') tab = '/rooms';
  else if (path === '/thread' || path === '/t') tab = '/threads';
  else if (path === '/history') tab = '/profile';
  var links = document.querySelectorAll('#nav a');
  for (var i = 0; i < links.length; i++) links[i].className = links[i].getAttribute('data-tab') === tab ? 'on' : '';
 }
 function route() {
  var raw = (location.hash || '#/').replace(/^#/, '');
  var parts = raw.split('/').filter(function (p) { return p; });
  var path = '/' + (parts[0] || '');
  var nextRoomId = parts[0] === 'room' ? parts[1] : null;
  var nextThreadId = parts[0] === 'thread' ? parts[1] : null;
  var cloudId = parts[0] === 't' ? parts[1] : null;
  if (jam) { jam.destroy(); jam = null; }
  if (tview) { tview.destroy(); tview = null; }
  closeAllSheets();
  var view = $('#view');
  view.innerHTML = '';
  window.scrollTo(0, 0);
  updateNav(path);
  if (cloudId) { renderCloudOpen(view, cloudId, parts[2]); return; }
  if (nextRoomId) { renderRoomView(view, nextRoomId); return; }
  if (nextThreadId) { renderThreadView(view, nextThreadId); return; }
  if (path === '/rooms') return renderRooms(view);
  if (path === '/threads') return renderThreads(view);
  if (path === '/library') return renderLibrary(view);
  if (path === '/history') return renderHistory(view);
  if (path === '/profile') return renderProfile(view);
  return renderHome(view);
 }
 window.addEventListener('hashchange', route);

 /* ══════════════ ホーム画面アイコン用 manifest（JS で動的に生成） ══════════════ */
 function setupManifest() {
  try {
   var i512 = document.querySelector('link[rel="icon"][sizes="512x512"]').href;
   var i192 = document.querySelector('link[rel="icon"][sizes="192x192"]').href;
   var i180 = document.querySelector('link[rel="apple-touch-icon"]').href;
   var base = location.href.split('#')[0].split('?')[0];
   var dir = base.slice(0, base.lastIndexOf('/') + 1);
   var m = {
    name: 'Stackjam', short_name: 'Stackjam', description: 'Layer your sound',
    start_url: base, scope: dir, display: 'standalone', orientation: 'portrait',
    background_color: '#0d0b14', theme_color: '#0d0b14',
    icons: [
     { src: i180, sizes: '180x180', type: 'image/png', purpose: 'any' },
     { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
     { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
   };
   if (/^https?:/.test(base)) {
    document.getElementById('manifestLink').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(m)));
   }
  } catch (e) {}
 }

 /* ══════════════ 初期化 ══════════════ */
 setupManifest();
 renderWho();
 if (!location.hash) location.hash = '#/';
 route();
})();

</script>
